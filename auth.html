<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In / Register — LocalHub</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-container">
        <a href="./index.html" class="logo">
          <div class="logo-icon-svg">
            <div class="logo-icon-inner">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 17L12 22L22 17" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 12L12 17L22 12" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <span class="logo-text">LocalHub</span>
        </a>
        <div class="nav-links">
          <a href="./index.html" class="nav-item">Back to Home</a>
        </div>
      </div>
    </nav>

    <!-- Auth Frame Wrapper -->
    <main class="auth-wrapper">
      <div class="auth-card" id="authCard">
        <!-- Dual Tab Headers -->
        <div class="auth-tabs" id="authTabsList">
          <div class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</div>
          <div class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">Create Account</div>
        </div>

        <div class="auth-body">
          <div class="auth-header">
            <h2 id="authTitle">Welcome Back</h2>
            <p id="authSubtitle">Enter your neighborhood credentials to proceed.</p>
          </div>

          <!-- Notification Feedback Bar -->
          <div id="authAlert" class="alert alert-info" style="display: none;"></div>

          <!-- Main Input Form -->
          <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <!-- Name Input (Hidden in Login Mode) -->
            <div class="form-group" id="groupName" style="display: none;">
              <label for="inputName">Full Name</label>
              <input type="text" id="inputName" class="form-control" placeholder="Alex Vance" />
              <div class="invalid-feedback" id="feedbackName">Please enter your name.</div>
            </div>

            <!-- Email Input -->
            <div class="form-group">
              <label for="inputEmail">Email Address</label>
              <input type="email" id="inputEmail" class="form-control" placeholder="customer@localhub.test" required />
              <div class="invalid-feedback" id="feedbackEmail">Please provide a valid email structure.</div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
              <label for="inputPassword">Password</label>
              <input type="password" id="inputPassword" class="form-control" placeholder="••••••••" required />
              <div class="invalid-feedback" id="feedbackPassword">Password is required.</div>
            </div>

            <!-- Role Dropdown (Hidden in Login Mode) -->
            <div class="form-group" id="groupRole" style="display: none;">
              <label for="selectRole">I want to register as a:</label>
              <select id="selectRole" class="form-control">
                <option value="customer">Customer (Buy services / Rent cars / Order decor supplies)</option>
                <option value="provider">Service Provider (Fulfill jobs / Lease cars / Dispatch staff)</option>
                <option value="delivery">Delivery Personnel (Fleet Runner / Manual Handover Courier)</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-full" id="authSubmitBtn" style="width: 100%; margin-top: 1rem;">Sign In</button>
          </form>

        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer style="margin-top: 3rem; padding: 1.5rem 2rem; background: var(--slate-900); color: var(--slate-400); font-size: 0.85rem; border-top: 1px solid var(--slate-800);">
      <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <strong style="color: var(--white);">LocalHub Marketplace</strong> &copy; 2026. All rights reserved.
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="theme-toggle-btn" onclick="window.toggleTheme()">🌙 Switch Theme</button>
          <a href="./index.html" style="color: var(--emerald-400);">Home</a>
          <a href="./customer.html" style="color: var(--slate-300);">Customer Portal</a>
          <a href="./provider.html" style="color: var(--slate-300);">Provider Hub</a>
        </div>
      </div>
    </footer>

    <!-- Core Script Imports -->
    <script type="module" src="./app.js"></script>
    <script>
      let currentMode = "login"; // "login" or "register"

      document.addEventListener("DOMContentLoaded", () => {
        // Parse tab parameter from URL query string if present
        const params = new URLSearchParams(window.location.search);
        const tabParam = params.get("tab");
        const roleParam = params.get("role");

        if (tabParam === "register") {
          switchAuthTab("register");
        } else {
          switchAuthTab("login");
        }

        if (roleParam === "provider" && document.getElementById("selectRole")) {
          document.getElementById("selectRole").value = "provider";
        }
      });

      window.switchAuthTab = function(mode) {
        currentMode = mode;
        const tabLogin = document.getElementById("tabLoginBtn");
        const tabRegister = document.getElementById("tabRegisterBtn");
        const groupName = document.getElementById("groupName");
        const groupRole = document.getElementById("groupRole");
        const authTitle = document.getElementById("authTitle");
        const authSubtitle = document.getElementById("authSubtitle");
        const authSubmitBtn = document.getElementById("authSubmitBtn");
        const authAlert = document.getElementById("authAlert");

        if (authAlert) authAlert.style.display = "none";

        if (mode === "login") {
          tabLogin.classList.add("active");
          tabRegister.classList.remove("active");
          groupName.style.display = "none";
          groupRole.style.display = "none";
          authTitle.innerText = "Welcome Back";
          authSubtitle.innerText = "Enter your neighborhood credentials to proceed.";
          authSubmitBtn.innerText = "Sign In";
        } else {
          tabLogin.classList.remove("active");
          tabRegister.classList.add("active");
          groupName.style.display = "block";
          groupRole.style.display = "block";
          authTitle.innerText = "Create Account";
          authSubtitle.innerText = "Join our hyperlocal marketplace community today.";
          authSubmitBtn.innerText = "Register Account";
        }
      };

      window.handleAuthSubmit = async function(e) {
        e.preventDefault();
        
        const email = document.getElementById("inputEmail").value.trim();
        const password = document.getElementById("inputPassword").value;
        const name = document.getElementById("inputName") ? document.getElementById("inputName").value.trim() : "";
        const role = document.getElementById("selectRole") ? document.getElementById("selectRole").value : "customer";
        
        const authAlert = document.getElementById("authAlert");
        const authSubmitBtn = document.getElementById("authSubmitBtn");
        
        if (authAlert) authAlert.style.display = "none";

        // Input validation
        if (!email.includes("@")) {
          document.getElementById("feedbackEmail").style.display = "block";
          return;
        } else {
          document.getElementById("feedbackEmail").style.display = "none";
        }

        if (password.length < 6) {
          document.getElementById("feedbackPassword").style.display = "block";
          document.getElementById("feedbackPassword").innerText = "Password must be at least 6 characters for Firebase Auth.";
          return;
        } else {
          document.getElementById("feedbackPassword").style.display = "none";
        }

        // Disable button during network request
        authSubmitBtn.disabled = true;
        authSubmitBtn.innerText = "Connecting to Firebase...";

        try {
          if (currentMode === "register") {
            if (!name) {
              document.getElementById("feedbackName").style.display = "block";
              authSubmitBtn.disabled = false;
              authSubmitBtn.innerText = "Register Account";
              return;
            } else {
              document.getElementById("feedbackName").style.display = "none";
            }

            const regRes = await window.LocalHubStore.registerUser(name, email, password, role);
            if (regRes.success) {
              window.showToastNotification(`Registered successfully! Welcome, ${name}!`);
              setTimeout(() => {
                if (role === "provider") {
                  window.location.href = "./provider.html";
                } else if (role === "delivery") {
                  window.location.href = "./delivery.html";
                } else {
                  window.location.href = "./customer.html";
                }
              }, 800);
            } else {
              console.error("[Registration Error]:", regRes.message);
              showErrorAlert(regRes.message || "Registration failed.");
            }
          } else {
            const loginRes = await window.LocalHubStore.loginUser(email, password);
            if (loginRes.success) {
              const uRole = loginRes.user.role;
              window.showToastNotification(`Logged in successfully! Welcome back, ${loginRes.user.name || name}.`);
              setTimeout(() => {
                if (uRole === "provider") {
                  window.location.href = "./provider.html";
                } else if (uRole === "delivery") {
                  window.location.href = "./delivery.html";
                } else {
                  window.location.href = "./customer.html";
                }
              }, 800);
            } else {
              console.error("[Login Error]:", loginRes.message);
              showErrorAlert(loginRes.message || "Invalid credentials or login failure.");
            }
          }
        } catch (err) {
          console.error("[Auth Exception]:", err);
          showErrorAlert("Authentication error: " + (err.message || err));
        } finally {
          authSubmitBtn.disabled = false;
          authSubmitBtn.innerText = currentMode === "register" ? "Register Account" : "Sign In";
        }
      };

      function showErrorAlert(msg) {
        const authAlert = document.getElementById("authAlert");
        if (authAlert) {
          authAlert.innerText = msg;
          authAlert.className = "alert alert-danger";
          authAlert.style.display = "flex";
          authAlert.style.backgroundColor = "var(--red-50)";
          authAlert.style.color = "var(--red-600)";
          authAlert.style.borderColor = "var(--red-200)";
        }
      }
    </script>
  </body>
</html>
